apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hr-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: 554422868760.dkr.ecr.eu-west-1.amazonaws.com/hr-ops-backend:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: backend-secret
          ports:
            - containerPort: 3000